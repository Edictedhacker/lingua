```yaml
workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Make Gradle executable
        script: |
          chmod +x ./gradlew

      - name: Build release APK
        script: |
          ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
```

